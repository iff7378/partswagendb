server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The shell must be revalidated every time. It names the hashed bundles, so
    # a cached copy pins the browser to old JavaScript for as long as it lives
    # there -- and because the version on screen comes from the API rather than
    # the bundle, the app looks updated while running the old code, which is
    # how this hides. no-cache means "check first", not "never store", so an
    # unchanged shell still costs only a 304.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routing: unknown paths still serve the app shell. try_files
    # redirects internally to /index.html, which re-enters the block above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
