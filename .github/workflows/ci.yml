name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Release note
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the previous commit to see what this push changed.
          fetch-depth: 0

      - name: Fail if app code changed without a release note
        run: |
          # Ian has asked twice for the What's new page to be kept current, and
          # asking someone to remember is not a mechanism. A change nobody is
          # told about may as well not have shipped -- and a release log with
          # gaps is worse than none, because it reads as complete.
          #
          # Escape hatch for work that genuinely changes nothing anyone would
          # notice: put [no changelog] in the commit message.
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against; skipping."
            exit 0
          fi

          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "Changed files:"; echo "$changed"

          if ! echo "$changed" | grep -qE '^(frontend/src|backend/app)/'; then
            echo "No application code touched."
            exit 0
          fi

          if echo "$changed" | grep -q '^frontend/src/lib/changelog.ts$'; then
            echo "Release note updated."
            exit 0
          fi

          if git log --format=%B "$base..${{ github.sha }}" | grep -qF '[no changelog]'; then
            echo "::warning::Application code changed with no release note, waived by [no changelog]."
            exit 0
          fi

          echo "::error::Application code changed but frontend/src/lib/changelog.ts did not."
          echo "Add an entry to today's release, or put [no changelog] in the commit message"
          echo "if genuinely nobody using the app would notice."
          exit 1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Test
        run: pytest --cov=app --cov-report=term-missing

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: partswagen
          POSTGRES_PASSWORD: partswagen
          POSTGRES_DB: partswagen
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: partswagen
      POSTGRES_PASSWORD: partswagen
      POSTGRES_DB: partswagen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Fail if the models have drifted from the migrations
        run: |
          # Alembic rejects hyphens in revision identifiers.
          alembic revision --autogenerate -m "drift check" --rev-id driftcheck
          if grep -qE "op\.(create|drop|add|alter)_" alembic/versions/driftcheck_*.py; then
            echo "::error::Models and migrations are out of sync. Generate a migration."
            cat alembic/versions/driftcheck_*.py
            exit 1
          fi
          rm -f alembic/versions/driftcheck_*.py

      - name: Roll all the way back down
        run: alembic downgrade base

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
