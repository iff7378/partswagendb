name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories surface without a push.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          # --skip-editable ignores this project itself, which is installed
          # editable and has no PyPI release to look up. Vulnerabilities in real
          # dependencies still fail the run.
          pip-audit --skip-editable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: |
          # npm's audit endpoint returns 503 often enough to block deploys on
          # its uptime rather than on anything about this code. Retry, and tell
          # the two failures apart: a real finding fails the job, a registry
          # outage warns and moves on. Failing on an outage is how a security
          # job gets trained into background noise.
          for attempt in 1 2 3; do
            if output=$(npm audit --audit-level=high 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if echo "$output" | grep -qE "audit endpoint returned an error|ENOTFOUND|ETIMEDOUT|503"; then
              echo "::warning::npm audit registry error on attempt ${attempt}, retrying"
              sleep $((attempt * 15))
              continue
            fi
            echo "::error::npm audit found vulnerabilities rated high or above"
            exit 1
          done
          # CodeQL, Trivy and Dependabot all still ran; this one check being
          # unreachable is worth a warning, not a red build.
          echo "::warning::npm audit endpoint unreachable after 3 attempts"

  images:
    name: Image scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t scan-target:${{ matrix.component }} ./${{ matrix.component }}

      - name: Scan it
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:${{ matrix.component }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload the results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
