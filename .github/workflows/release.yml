name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the CalVer version
        id: version
        run: |
          # Date-based, with a counter so several releases in one day stay
          # distinct. Reads the tags that already exist rather than a file, so
          # nothing has to be bumped by hand.
          git fetch --tags --force --quiet
          today="$(date -u +%Y.%m.%d)"
          n="$(git tag -l "${today}*" | wc -l)"
          if [ "$n" -gt 0 ]; then
            version="${today}-${n}"
          else
            version="$today"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  tag:
    name: Tag the release
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the CalVer tag
        run: |
          git fetch --tags --force --quiet
          today="$(date -u +%Y.%m.%d)"
          n="$(git tag -l "${today}*" | wc -l)"
          if [ "$n" -gt 0 ]; then
            version="${today}-${n}"
          else
            version="$today"
          fi
          git tag "$version"
          git push origin "$version"
          echo "Tagged $version"
